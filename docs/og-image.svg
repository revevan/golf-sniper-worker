<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1b5e20"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1200" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1080" cy="180"  r="280" fill="rgba(255,255,255,0.04)"/>
  <circle cx="1080" cy="180"  r="190" fill="rgba(255,255,255,0.05)"/>
  <circle cx="1080" cy="180"  r="100" fill="rgba(255,255,255,0.06)"/>
  <circle cx="160"  cy="1040" r="220" fill="rgba(0,0,0,0.08)"/>

  <!-- Golf hole + flag -->
  <line x1="600" y1="330" x2="600" y2="530" stroke="white" stroke-width="7" stroke-linecap="round"/>
  <polygon points="600,330 696,368 600,406" fill="white" opacity="0.95"/>
  <ellipse cx="600" cy="542" rx="62" ry="15" fill="rgba(0,0,0,0.25)"/>
  <ellipse cx="600" cy="537" rx="26" ry="8"  fill="#0d3b12"/>

  <!-- Title -->
  <text x="600" y="700"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="112" font-weight="800" fill="white" letter-spacing="-2">
    Tee Time Sniper
  </text>
</svg>
