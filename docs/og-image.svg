<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1b5e20"/>
      <stop offset="100%" style="stop-color:#388e3c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1080" cy="100" r="220" fill="rgba(255,255,255,0.04)"/>
  <circle cx="1080" cy="100" r="150" fill="rgba(255,255,255,0.05)"/>
  <circle cx="1080" cy="100" r="80"  fill="rgba(255,255,255,0.06)"/>
  <circle cx="160"  cy="540" r="160" fill="rgba(0,0,0,0.08)"/>

  <!-- Golf hole + flag -->
  <line x1="600" y1="170" x2="600" y2="340" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <polygon points="600,170 680,200 600,230" fill="white" opacity="0.95"/>
  <ellipse cx="600" cy="348" rx="52" ry="12" fill="rgba(0,0,0,0.25)"/>
  <ellipse cx="600" cy="344" rx="22" ry="7" fill="#0d3b12"/>

  <!-- Title -->
  <text x="600" y="450"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="88" font-weight="800" fill="white" letter-spacing="-1">
    Tee Time Sniper
  </text>
</svg>
