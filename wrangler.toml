name = "golf-sniper"
main = "src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
# every 10 min all day; every 2 min during ~5–8 AM Pacific (UTC 13–16) to catch tee time openings
crons = ["*/10 * * * *", "*/2 13-16 * * *"]

[[kv_namespaces]]
binding = "KV"
id = "e47ef586fb7b41eeb38994c84f9ef7cc"

[observability.logs]
enabled = true
invocation_logs = true
